<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节奏候选试听</title>
<style>
  body{margin:24px auto;padding:0 20px;max-width:1200px;background:#f3f5f5;color:#24363b;font:15px system-ui,sans-serif}
  h1{font-size:25px}p{line-height:1.7}audio{width:100%}button,input{font:inherit;padding:6px;margin:4px}
  canvas{width:100%;height:420px;background:white;cursor:crosshair}label{white-space:nowrap}
  #status{font-variant-numeric:tabular-nums}#preview{display:flex;gap:20px;align-items:center;height:100px}
  .element{width:90px;height:30px;transform-origin:center;background:#956644}#mid{background:#3b7771}#high{background:#69709b}
  #cue{font-weight:600;min-width:200px}#points button{font-size:13px}small{color:#52646a}
</style>
<h1>节奏候选试听</h1>
<p>低、中、高频是混音中的频段活动，尚未确认乐器。节拍不是小节第一拍；红线是待筛选的能量或音色变化。先听前奏，确认 9.512 秒前后的差别，再挑少量断点给 Clawd。</p>
<audio id="audio" controls preload="metadata" src="../../../public/private/audio/try-me.flac"></audio>
<div>
  <label>起点 <input id="start" type="number" min="0" step="0.1" value="0"></label>
  <label>终点 <input id="end" type="number" min="0" step="0.1" value="20"></label>
  <label><input id="loop" type="checkbox" checked>循环选段</label>
  <button id="apply">查看选段</button><button id="intro">前奏</button><button id="focus">前55秒</button><button id="full">全曲</button>
</div>
<p id="status" aria-live="off"></p>
<canvas id="plot" aria-label="可点击定位的频段包络、节拍、起音和断点候选"></canvas>
<div id="preview"><div id="low" class="element"></div><div id="mid" class="element"></div><div id="high" class="element"></div><span id="cue">环境元素响应示意</span></div>
<small>低频虚线为 HPSS 谐波低频成分，帮助观察持续低音；仍不是 bass 分轨。色块仅用于检视轨迹区别，红色提示为稀疏动作候选，Clawd 动作尚未接入。点击画布跳转，空格播放/暂停；曲线各自归一，不能跨轨比较音量。</small>
<p id="points"></p>
<script>
const data=__ANALYSIS_DATA__;
const audio=document.getElementById('audio'), canvas=document.getElementById('plot'), ctx=canvas.getContext('2d');
const start=document.getElementById('start'),end=document.getElementById('end'),loop=document.getElementById('loop');
const keys=['low','mid','high'], names=['低频 35–180 Hz','中频 180–2000 Hz','高频 2000–10000 Hz'];
const colors=['#956644','#3b7771','#69709b'];
let left=0,right=20;
function setRange(a,b){left=Math.max(0,a);right=Math.min(data.audio.duration_sec,Math.max(left+.2,b));start.value=left;end.value=right;audio.currentTime=left;renderPoints();}
function renderPoints(){const box=document.getElementById('points');box.replaceChildren();for(const p of data.tracks.accent.filter(p=>p.time_sec>=left&&p.time_sec<right)){const b=document.createElement('button');b.textContent=p.time_sec.toFixed(3)+'s '+p.reason;b.onclick=()=>{audio.currentTime=Math.max(left,p.time_sec-.7);void audio.play().catch(showError)};box.append(b)}}
function showError(e){document.getElementById('status').textContent='播放失败：'+e.message}
document.getElementById('apply').onclick=()=>{const a=Number(start.value),b=Number(end.value);if(Number.isFinite(a)&&Number.isFinite(b)&&b>a&&a<data.audio.duration_sec)setRange(a,b)};
document.getElementById('intro').onclick=()=>setRange(0,20);
document.getElementById('focus').onclick=()=>setRange(0,data.parameters.focus_end_sec);
document.getElementById('full').onclick=()=>setRange(0,data.audio.duration_sec);
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1200;audio.currentTime=Math.max(left,Math.min(right,left+(x-160)/1020*(right-left)))};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();if(audio.paused)void audio.play().catch(showError);else audio.pause()}});
audio.onerror=()=>showError(new Error('原音源未加载；请保持此页面与项目 public/private/ 的相对路径，或通过本地 HTTP 服务打开。'));
function draw(){
  if(loop.checked&&!audio.paused&&audio.currentTime>=right)audio.currentTime=left;
  if(audio.ended&&loop.checked){audio.currentTime=left;void audio.play().catch(showError)}
  const dpr=window.devicePixelRatio||1;if(canvas.width!==1200*dpr){canvas.width=1200*dpr;canvas.height=420*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,1200,420);
  const x=t=>160+(t-left)/(right-left)*1020;
  ctx.font='13px system-ui';ctx.fillStyle='#24363b';
  const tick=(right-left)>60?15:(right-left)>25?5:1;
  for(let t=Math.ceil(left/tick)*tick;t<=right;t+=tick){ctx.fillStyle='#52646a';ctx.fillText(t.toFixed(0)+'s',x(t),18);ctx.strokeStyle='#e8eeee';ctx.beginPath();ctx.moveTo(x(t),25);ctx.lineTo(x(t),405);ctx.stroke()}
  const times=data.envelopes.times_sec;
  keys.forEach((key,row)=>{const base=115+row*90;ctx.fillStyle=colors[row];ctx.fillText(names[row],8,base-28);ctx.strokeStyle=colors[row];ctx.beginPath();let first=true;
    times.forEach((t,i)=>{if(t<left||t>right)return;const y=base-data.envelopes[key][i]*65;if(first){ctx.moveTo(x(t),y);first=false}else ctx.lineTo(x(t),y)});ctx.stroke();
    for(const p of data.tracks[key])if(p.time_sec>=left&&p.time_sec<=right){ctx.globalAlpha=.3;ctx.beginPath();ctx.moveTo(x(p.time_sec),base);ctx.lineTo(x(p.time_sec),base+10);ctx.stroke()}ctx.globalAlpha=1;
  });
  ctx.strokeStyle=colors[0];ctx.setLineDash([4,3]);ctx.beginPath();let firstH=true;times.forEach((t,i)=>{if(t<left||t>right)return;const y=115-data.envelopes.harmonic_low[i]*65;if(firstH){ctx.moveTo(x(t),y);firstH=false}else ctx.lineTo(x(t),y)});ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#63757d';ctx.fillText('节拍候选',8,355);
  for(const p of data.tracks.beat)if(p.time_sec>=left&&p.time_sec<=right){ctx.fillRect(x(p.time_sec),335,1,25)}
  ctx.fillStyle='#ad483c';ctx.fillText('断点候选',8,390);
  for(const p of data.tracks.break)if(p.time_sec>=left&&p.time_sec<=right){ctx.fillRect(x(p.time_sec)-1,370,2,30)}
  for(const p of data.tracks.accent)if(p.time_sec>=left&&p.time_sec<=right){ctx.fillRect(x(p.time_sec)-3,370,6,30)}
  for(const p of data.human_references)if(p.time_sec>=left&&p.time_sec<=right){ctx.strokeStyle='#24363b';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x(p.time_sec),25);ctx.lineTo(x(p.time_sec),405);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#24363b';ctx.fillText('人工 bass 进入 '+p.time_sec.toFixed(3)+'s',x(p.time_sec)+4,40)}
  const t=audio.currentTime;ctx.strokeStyle='#b44e32';ctx.beginPath();ctx.moveTo(x(t),24);ctx.lineTo(x(t),405);ctx.stroke();
  const i=Math.min(times.length-1,Math.max(0,Math.round(t/data.parameters.curve_step_sec)));
  keys.forEach(k=>{const v=data.envelopes[k][i];document.getElementById(k).style.transform='scaleY('+(0.5+v*1.6)+')';document.getElementById(k).style.opacity=.25+v*.75});
  const nearby=data.tracks.accent.find(p=>t>=p.time_sec&&t-p.time_sec<.3);document.getElementById('cue').textContent=nearby?'动作卡点候选 · '+nearby.reason:'环境元素响应示意';document.getElementById('cue').style.color=nearby?'#ad483c':'#24363b';
  document.getElementById('status').textContent=t.toFixed(3)+'s / '+data.audio.duration_sec.toFixed(3)+'s · 选段 '+left.toFixed(3)+'–'+right.toFixed(3)+'s · 全部机器结果待试听';
  requestAnimationFrame(draw);
}
renderPoints();requestAnimationFrame(draw);
</script>
</html>
